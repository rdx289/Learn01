<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Application</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { max-width: 800px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        input:focus { outline: none; border-color: #007bff; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #007bff; color: #fff; }
        .btn-primary:hover { background: #0056b3; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #1e7e34; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-secondary:hover { background: #545b62; }
        .table-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; font-weight: bold; }
        tr:hover { background: #f8f9fa; }
        .actions { display: flex; gap: 5px; }
        .hidden { display: none; }
        .empty { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <h1>CRUD Application</h1>
    <div class="form-card">
        <form id="crudForm">
            <input type="hidden" id="userId">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Enter name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter email">
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary">Add Record</button>
            <button type="button" id="cancelBtn" class="btn btn-secondary hidden" onclick="resetForm()">Cancel</button>
        </form>
    </div>
    <div class="table-card">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyMsg" class="empty hidden">No records found</div>
    </div>
    <script>
        let records = JSON.parse(localStorage.getItem('crudRecords')) || [];
        let editingId = null;
        function saveStorage() {
            localStorage.setItem('crudRecords', JSON.stringify(records));
        }
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const emptyMsg = document.getElementById('emptyMsg');
            const table = document.getElementById('dataTable');
            if (records.length === 0) {
                table.style.display = 'none';
                emptyMsg.classList.remove('hidden');
                return;
            }
            table.style.display = 'table';
            emptyMsg.classList.add('hidden');
            tbody.innerHTML = records.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>${escapeHtml(r.name)}</td>
                    <td>${escapeHtml(r.email)}</td>
                    <td class="actions">
                        <button class="btn btn-success" onclick="editRecord(${r.id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteRecord(${r.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function generateId() {
            return records.length > 0 ? Math.max(...records.map(r => r.id)) + 1 : 1;
        }
        document.getElementById('crudForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            if (editingId) {
                const index = records.findIndex(r => r.id === editingId);
                records[index] = { id: editingId, name, email };
                editingId = null;
                document.getElementById('submitBtn').textContent = 'Add Record';
                document.getElementById('cancelBtn').classList.add('hidden');
            } else {
                records.push({ id: generateId(), name, email });
            }
            saveStorage();
            renderTable();
            this.reset();
        });
        function editRecord(id) {
            const record = records.find(r => r.id === id);
            document.getElementById('userId').value = id;
            document.getElementById('name').value = record.name;
            document.getElementById('email').value = record.email;
            editingId = id;
            document.getElementById('submitBtn').textContent = 'Update Record';
            document.getElementById('cancelBtn').classList.remove('hidden');
        }
        function deleteRecord(id) {
            if (confirm('Are you sure you want to delete this record?')) {
                records = records.filter(r => r.id !== id);
                saveStorage();
                renderTable();
            }
        }
        function resetForm() {
            document.getElementById('crudForm').reset();
            editingId = null;
            document.getElementById('submitBtn').textContent = 'Add Record';
            document.getElementById('cancelBtn').classList.add('hidden');
        }
        renderTable();
    </script>
</body>
</html>
